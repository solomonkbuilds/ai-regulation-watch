name: Monitor regulatory sources

on:
  schedule:
    # Runs daily at 09:00 UTC. Adjust cadence as needed — regulatory pages
    # don't change hourly, so daily/weekly is usually plenty.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.main

      - name: Commit updated database
        run: |
          git config user.name "ai-reg-watch-bot"
          git config user.email "actions@github.com"
          git add data/ai_reg_watch.db
          git diff --staged --quiet || git commit -m "chore: update regulatory change log [automated]"
          git push
